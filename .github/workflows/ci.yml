name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm -r typecheck
      - name: Listening and sync tests
        run: node --test web/test/*.test.ts
      - name: Build web app
        run: pnpm --filter @musike/web build
      - name: Prepare Android app
        run: pnpm --filter @musike/mobile build
      - name: Build Android debug APK and run unit tests
        working-directory: mobile/android
        run: sh ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Musike-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
